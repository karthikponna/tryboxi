# Local observability for sandboxd: Prometheus (metrics), Grafana (dashboard),
# Jaeger (traces). Start sandboxd with:
#   sandboxd serve --metrics-listen 127.0.0.1:9464 --otlp-endpoint http://127.0.0.1:4318
# then: docker compose -f deploy/observability/docker-compose.yml up -d
#   Grafana    http://localhost:3000  (dashboard "sandboxd", no login needed)
#   Prometheus http://localhost:9090
#   Jaeger     http://localhost:16686 (service "sandboxd")
name: sandboxd-observability
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sandboxd-dashboard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/sandboxd-dashboard.json:/var/lib/grafana/dashboards/sandboxd-dashboard.json:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped
