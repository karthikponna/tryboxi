name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: vet (linux/arm64 guest + firecracker)
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go vet ./...
      - name: unit tests
        run: go test -race ./...
      - name: build guest agent
        run: make agent
      - name: build host binaries
        run: make build
